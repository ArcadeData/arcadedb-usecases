name: Supply Chain CI

on:
  workflow_call:
  push:
    paths:
      - supply-chain/**
      - .github/workflows/supply-chain.yml
  pull_request:
    paths:
      - supply-chain/**
      - .github/workflows/supply-chain.yml

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [curl, java, js]

    env:
      ARCADEDB_URL: http://localhost:2480
      ARCADEDB_USER: root
      ARCADEDB_PASS: arcadedb

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Java
        if: matrix.runner == 'java'
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven repository
        if: matrix.runner == 'java'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-supply-chain-${{ hashFiles('supply-chain/java/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-supply-chain-

      - name: Set up Node.js
        if: matrix.runner == 'js'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Cache npm
        if: matrix.runner == 'js'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-supply-chain-${{ hashFiles('supply-chain/js/package.json') }}
          restore-keys: ${{ runner.os }}-npm-supply-chain-

      - name: Install JS dependencies
        if: matrix.runner == 'js'
        working-directory: supply-chain/js
        run: npm install

      - name: Start ArcadeDB
        working-directory: supply-chain
        run: docker compose up -d

      - name: Setup database
        working-directory: supply-chain
        run: ./setup.sh

      - name: Run curl queries
        if: matrix.runner == 'curl'
        working-directory: supply-chain
        run: ./queries/queries.sh

      - name: Build and run Java
        if: matrix.runner == 'java'
        working-directory: supply-chain/java
        run: |
          mvn package --no-transfer-progress
          java -jar target/supply-chain.jar

      - name: Run JavaScript queries
        if: matrix.runner == 'js'
        working-directory: supply-chain/js
        run: node supply-chain.js

      - name: Teardown
        if: always()
        working-directory: supply-chain
        run: docker compose down
