name: Route Planning CI

on:
  workflow_call:
  push:
    paths:
      - route-planning/**
      - .github/workflows/route-planning.yml
  pull_request:
    paths:
      - route-planning/**
      - .github/workflows/route-planning.yml

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [curl, java]

    env:
      ARCADEDB_URL: http://localhost:2480
      ARCADEDB_USER: root
      ARCADEDB_PASS: arcadedb

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Cache the DIMACS Florida road network
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: route-planning/data
          key: dimacs-fla-${{ hashFiles('route-planning/setup.sh') }}

      - name: Set up Java
        if: matrix.runner == 'java'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven repository
        if: matrix.runner == 'java'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-route-planning-${{ hashFiles('route-planning/java/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-route-planning-

      - name: Start ArcadeDB
        working-directory: route-planning
        run: docker compose up -d

      - name: Setup database
        working-directory: route-planning
        run: ./setup.sh

      - name: Run curl queries
        if: matrix.runner == 'curl'
        working-directory: route-planning
        run: ./queries/queries.sh

      - name: Build and run Java
        if: matrix.runner == 'java'
        working-directory: route-planning/java
        run: |
          mvn package --no-transfer-progress
          java -jar target/route-planning.jar

      - name: Teardown
        if: always()
        working-directory: route-planning
        run: docker compose down
