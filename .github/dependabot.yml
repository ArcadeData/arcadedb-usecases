version: 2
updates:
  # ── GitHub Actions ───────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: "sunday"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ── Maven ────────────────────────────────────────────────────────────────────
  - package-ecosystem: "maven"
    directory: "/recommendation-engine/java"
    schedule:
      interval: weekly
      day: "sunday"
    open-pull-requests-limit: 20
    groups:
      arcadedb:
        patterns:
          - "com.arcadedb:*"
      maven-plugins:
        patterns:
          - "org.apache.maven.plugins:*"

  - package-ecosystem: "maven"
