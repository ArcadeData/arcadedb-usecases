version: 2
updates:
  # ── GitHub Actions ───────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: "sunday"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ── Maven ────────────────────────────────────────────────────────────────────
  - package-ecosystem: "maven"
    directories:
      - "/recommendation-engine/java"
      - "/knowledge-graphs/java"
      - "/graph-rag/java"
      - "/graph-rag/langchain4j"
      - "/fraud-detection/java"
      - "/realtime-analytics/java"
      - "/supply-chain/java"
      - "/iam/java"
      - "/customer-360/java"
      - "/social-network-analytics/java"
      - "/feature-store/java"
    schedule:
      interval: weekly
      day: "sunday"
    open-pull-requests-limit: 20
    groups:
      arcadedb:
        patterns:
          - "com.arcadedb:*"
      neo4j:
        patterns:
          - "org.neo4j.driver:*"
      langchain4j:
        patterns:
          - "dev.langchain4j:*"
      maven-plugins:
        patterns:
          - "org.apache.maven.plugins:*"

  # ── npm ──────────────────────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directories:
      - "/supply-chain/js"
      - "/feature-store/js"
    schedule:
      interval: weekly
      day: "sunday"
    open-pull-requests-limit: 10
    groups:
      node-pg:
        patterns:
          - "pg"

  # ── pip ──────────────────────────────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/iam/python"
    schedule:
      interval: weekly
      day: "sunday"
    open-pull-requests-limit: 10
    groups:
      psycopg:
        patterns:
          - "psycopg*"

  # ── Docker Compose ───────────────────────────────────────────────────────────
  - package-ecosystem: "docker-compose"
    directories:
      - "/recommendation-engine"
      - "/knowledge-graphs"
      - "/graph-rag"
      - "/fraud-detection"
      - "/realtime-analytics"
      - "/supply-chain"
      - "/iam"
      - "/customer-360"
      - "/social-network-analytics"
      - "/feature-store"
    schedule:
      interval: weekly
      day: "sunday"
    open-pull-requests-limit: 10
    groups:
      arcadedb-docker:
        patterns:
          - "arcadedata/arcadedb"
